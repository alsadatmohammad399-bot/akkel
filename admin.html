<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ادمن - أكيل</title>
<style>body{font-family:cairo;background:#111;color:#fff;padding:15px} .order{background:#222;padding:12px;border-radius:12px;margin:10px 0} button{padding:8px 12px;border-radius:8px;border:0;margin:3px;cursor:pointer} .green{background:#00b14f;color:#fff} .orange{background:#ff5a00;color:#fff}</style>
</head>
<body>
<h2>لوحة الطلبات</h2>
<div id="list"></div>
<script>
function render(){let arr=JSON.parse(localStorage.getItem("akkel_orders")||"[]");let h="";arr.reverse().forEach(o=>{h+=`<div class="order"><b>${o.restaurant} - ${o.item}</b><br>العميل: ${o.name} - ${o.phone}<br>العنوان: ${o.addr}<br>الاجمالي: ${o.total}ج - الحالة: ${o.status||'preparing'}<br><button class="orange" onclick="setStatus('${o.phone}','on_the_way')">الطيار استلم - شغل الخريطة للعميل</button><button class="green" onclick="setStatus('${o.phone}','delivered')">تم التوصيل</button></div>`});document.getElementById("list").innerHTML=h||"لا يوجد طلبات";}
function setStatus(phone,status){let arr=JSON.parse(localStorage.getItem("akkel_orders")||"[]");let o=arr.find(x=>x.phone===phone);if(o){o.status=status;localStorage.setItem("akkel_orders",JSON.stringify(arr));if(status==="on_the_way")localStorage.setItem("akkel_status","on_the_way");render()}}
render();
</script>
</body>
</html>
