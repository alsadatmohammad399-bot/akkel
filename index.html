<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكّيل - إسماعيلية</title>
<style>
body{font-family:system-ui;background:#FFF8F0;margin:0}
header{background:#FF3B30;color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:22px}
.container{padding:15px}
.card{background:#fff;border-radius:15px;padding:15px;margin-bottom:15px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.btn{background:#FF3B30;color:#fff;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<header>🍔 أكّيل إسماعيلية - عمولة 15%</header>
<div class="container">
  <div class="card">
    <h3>برجر فاكتوري</h3>
    <p>دبل تشيز برجر - 135ج</p>
    <button class="btn" onclick="orderNow('برجر فاكتوري','دبل تشيز برجر',135)">اطلب الآن - 155ج بالتوصيل</button>
  </div>
  <div id="status" style="text-align:center;margin-top:20px;font-weight:bold"></div>
</div>

<script>
async function orderNow(restaurant, item, price){
  const total = price + 20;
  const profit = Math.round(total*0.15);
  const name = prompt("اسمك؟") || "عميل";
  const phone = prompt("رقم موبايلك؟") || "01000000000";
  const addr = prompt("عنوانك؟") || "حي الزهور";

  document.getElementById('status').innerText = "جاري الإرسال...⏳";

  // ده بيكلم الـ API الآمن بتاعك على Vercel (مش بيكلم تليجرام مباشر)
  try{
    const res = await fetch("https://akkel-ism.vercel.app/api/order", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({restaurant, item, price, total, profit, name, phone, addr})
    });
    const data = await res.json();
    if(data.ok){
      document.getElementById('status').innerText = "✅ تم! الطلب وصلك على @akkel_ism_bot";
    } else {
      document.getElementById('status').innerText = "❌ " + data.error;
    }
  } catch(e){
    // لو لسه معملتش Vercel، هيشتغل مؤقتاً بالطريقة المباشرة (للتست بس)
    document.getElementById('status').innerText = "⚠️ لسه محتاج تظبط Vercel - قولّي ابعت ملف الـ API";
  }
}
</script>
</body>
</html>
