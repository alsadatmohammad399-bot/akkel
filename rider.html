<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المندوب - Rider</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Cairo',sans-serif;background:#fff}#map{height:65vh}.bar{padding:15px;background:#111;color:#fff}button{width:100%;padding:16px;background:#00b14f;color:#fff;border:0;border-radius:12px;font-weight:800;font-size:16px}</style>
</head>
<body>
<div class="bar"><b>🛵 تطبيق المندوب</b><br><small id="status">جاري تحديد موقعك...</small></div>
<div id="map"></div>
<div style="padding:15px"><div id="orderInfo" style="background:#f5f5f5;padding:12px;border-radius:10px;margin-bottom:10px">لا يوجد طلبات - انتظر</div><button id="btn">استلام الطلب والتحرك للعميل</button></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map=L.map('map').setView([30.585,32.27],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker,currentPos={lat:30.585,lng:32.27},riderId="rider_1",hasOrder=false;

function updatePos(lat,lng){
 currentPos={lat,lng};
 document.getElementById("status").innerText=`موقعك: ${lat.toFixed(5)}, ${lng.toFixed(5)} - يتم ارساله للعميل لايف`;
 if(!marker) marker=L.marker([lat,lng]).addTo(map); else marker.setLatLng([lat,lng]);
 fetch("/api?type=rider-location",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({riderId,lat,lng})});
}

if(navigator.geolocation){
 navigator.geolocation.watchPosition(p=>{updatePos(p.coords.latitude,p.coords.longitude)},()=>{}, {enableHighAccuracy:true});
} else {
 setInterval(()=>{currentPos.lat+=0.0002;currentPos.lng+=0.0002;updatePos(currentPos.lat,currentPos.lng)},3000);
}

async function checkOrders(){
 try{
  let res=await fetch("/api?type=vendor");
  let arr=await res.json();
  let o=arr.find(x=>x.status==="preparing" || x.status==="ready");
  if(o){document.getElementById("orderInfo").innerHTML=`<b>طلب جديد!</b><br>${o.restaurant}<br>${o.item}<br>${o.name} - ${o.phone}<br><a href="https://maps.google.com/?q=${o.location}" target="_blank">افتح موقع العميل</a>`;hasOrder=o;}
 }catch(e){}
}
setInterval(checkOrders,4000);checkOrders();

document.getElementById("btn").onclick=async()=>{
 if(!hasOrder) return alert("مفيش طلبات حاليا");
 await fetch("/api?type=update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:hasOrder.phone,status:"on_the_way",riderId})});
 alert("تم استلام الطلب! العميل شايفك دلوقتي على الخريطة - خريطة العميل هتظهر");
 setInterval(()=>{currentPos.lat+=0.0003;currentPos.lng+=0.0003;updatePos(currentPos.lat,currentPos.lng)},3000);
}
</script>
</body>
</html>
