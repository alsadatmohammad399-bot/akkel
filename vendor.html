<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المطعم - Vendor</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>body{font-family:'Cairo',sans-serif;background:#f5f5f5;margin:0;padding:15px}h2{margin:0 0 15px}.order{background:#fff;padding:15px;border-radius:12px;margin:10px 0;box-shadow:0 2px 5px #0001}button{padding:10px 14px;border-radius:8px;border:0;margin:4px;cursor:pointer;font-weight:800}.green{background:#00b14f;color:#fff}.orange{background:#ff5a00;color:#fff}</style>
</head>
<body>
<h2>🍳 لوحة المطعم - الطلبات الجديدة</h2>
<div id="orders">جاري التحميل...</div>
<script>
async function load(){
 try{
  let res=await fetch("/api?type=vendor");
  let arr=await res.json();
  if(!arr.length){document.getElementById("orders").innerHTML="لا يوجد طلبات";return;}
  document.getElementById("orders").innerHTML=arr.reverse().map(o=>`<div class="order"><b>${o.restaurant}</b><br>${o.item}<br>العميل: ${o.name} - ${o.phone}<br>الاجمالي: ${o.total}ج - الحالة: ${o.status}<br><button class="green" onclick="updateStatus('${o.phone}','preparing')">قبول</button><button class="orange" onclick="updateStatus('${o.phone}','on_the_way')">جاهز - نادى الطيار</button><button onclick="updateStatus('${o.phone}','delivered')" style="background:#111;color:#fff">تم التوصيل</button></div>`).join("");
 }catch(e){document.getElementById("orders").innerHTML="خطأ في التحميل"}
}
async function updateStatus(id,status){
 await fetch("/api?type=update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,status,riderId:"rider_1"})});
 load();
}
setInterval(load,4000);load();
</script>
</body>
</html>
